name: App Store

# Release automation with the App Store Connect API. A job runs when a pushed commit message names it:
#   [asc check] [asc register] [asc app]   API commands (tools/asc/asc.py), on Linux
#   [asc build]                            archive, sign with cloud signing, and upload to TestFlight, on macOS
# The private key is the ASC_PRIVATE_KEY repository secret. The key ID and issuer ID below aren't secret on their
# own: they only work together with that key.
on:
  push:
    branches: ['claude/**', 'main']

permissions:
  contents: read

env:
  ASC_KEY_ID: 23US7Q78B8
  ASC_ISSUER_ID: 26484742-92b7-4b33-840c-c94e1292503c

jobs:
  api:
    if: contains(github.event.head_commit.message, '[asc ') && !contains(github.event.head_commit.message, '[asc build]')
    name: App Store Connect API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'pyjwt[crypto]' requests
      - name: Run the commands in the commit message
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 tools/asc/asc.py from-commit-message
