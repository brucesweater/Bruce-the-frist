name: Screenshots

# Runs the UI tests on the largest iPhone simulator and commits the screenshots to the branch, so they can be
# reviewed and used for the App Store. Starts on a push whose commit message contains "[screenshots]"
# (small previews) or "[screenshots full]" (also full-resolution images), or by hand.
on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:
    inputs:
      full:
        description: Also commit full-resolution screenshots
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots')
    name: Capture screenshots
    # At the job level so pushes without "[screenshots]" (whose job is skipped) don't cancel a run in progress.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Boot the screenshot simulator
        id: sim
        run: .github/scripts/screenshot-simulator.sh

      - name: Run the UI tests
        # Keep going when a test fails, so the screens that did work are still captured and committed.
        continue-on-error: true
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: |
          set +e
          mkdir -p build/screenshots
          xcodebuild -version
          xcodebuild test \
            -project Unhook.xcodeproj \
            -scheme UnhookUITests \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-uitests.log | grep -E "error:|Test Case .*(passed|failed)|Test case .*(passed|failed)|XCTAssert|XCTFail|failed:|AXDUMP|\*\* TEST"
          status=${PIPESTATUS[0]}
          echo "UI tests finished with status $status on ${{ steps.sim.outputs.name }}"
          ls build/screenshots
          exit "$status"

      - name: Commit screenshots to the branch
        env:
          FULL: ${{ inputs.full == true || contains(github.event.head_commit.message, '[screenshots full]') }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(build/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "No screenshots were captured." >&2
            exit 1
          fi
          dest=AppStore/screenshots/raw
          rm -rf "$dest/preview"
          mkdir -p "$dest/preview"
          for shot in "${shots[@]}"; do
            name=$(basename "$shot" .png)
            sips -s format jpeg -s formatOptions 72 --resampleWidth 660 "$shot" --out "$dest/preview/$name.jpg" >/dev/null
          done
          if [ "$FULL" = "true" ]; then
            rm -rf "$dest/full"
            mkdir -p "$dest/full"
            for shot in "${shots[@]}"; do
              name=$(basename "$shot" .png)
              sips -s format jpeg -s formatOptions 93 "$shot" --out "$dest/full/$name.jpg" >/dev/null
            done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$dest"
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "Update UI screenshots from CI (${GITHUB_SHA::7})"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            xcodebuild-uitests.log
            UITestResults.xcresult
          if-no-files-found: ignore
